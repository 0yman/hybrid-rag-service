services:
  app:
    build: .
    image: ask-your-documents:latest
    ports:
      - "8000:8000"
    env_file:
      # Optional. Without it, answers quote your documents directly.
      - path: .env
        required: false
    volumes:
      # Your documents and their index survive restarts and rebuilds.
      - documents:/app/data/index
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  documents:
  uploads:
