name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Install exactly what a user installs. An earlier version of this job
      # hand-picked a smaller set to save a minute, and so missed that the
      # provider SDKs the tests exercise were not in it - CI went red on a
      # commit that a real install would have handled fine.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src eval scripts tests app.py

      # The suite uses the hashing embedder and the extractive engine: no model
      # download, no network, no API key.
      - name: Test
        run: python -m pytest -q

  evaluate:
    # Re-runs the retrieval evaluation on the committed benchmark corpus, so a
    # change that quietly degrades recall shows up in the pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate both query sets (default runtime)
        run: |
          python eval/run_eval.py --ablate --k-sweep 1,3,5,10 --generate \
            --out /tmp/results.md --json-out /tmp/results.json
          python eval/run_eval.py --ablate -k 3 --golden eval/golden_keyword.jsonl \
            --out /tmp/results_keyword.md --json-out /tmp/results_keyword.json

      - name: Check retrieval and answers have not regressed
        run: |
          python - <<'PY'
          import json, sys

          # Floors a little under the committed numbers, so noise does not
          # fail a build but a real regression does.
          CHECKS = [
              ("/tmp/results.json", "hybrid (RRF)", 0.95),          # natural language, recall@5
              ("/tmp/results_keyword.json", "hybrid (RRF)", 0.90),  # keyword queries, recall@3
          ]
          failed = False
          for path, retriever, floor in CHECKS:
              report = json.load(open(path))
              k = report["k"]
              value = report["retrieval"][retriever]["aggregate"][f"recall@{k}"]
              ok = value >= floor
              print(f"{'ok' if ok else 'REGRESSED'}: {path} {retriever} recall@{k}={value:.3f} (floor {floor})")
              failed |= not ok

          answers = json.load(open("/tmp/results.json"))["answers"]
          for metric, floor in [("abstention_accuracy", 0.95), ("citation_rate", 0.95)]:
              ok = answers[metric] >= floor
              print(f"{'ok' if ok else 'REGRESSED'}: {metric}={answers[metric]:.3f} (floor {floor})")
              failed |= not ok
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: /tmp/results*
