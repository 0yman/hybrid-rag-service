name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The suite runs on the hash embedder and the mock LLM, so it needs
      # neither an API key nor a model download. Installing the heavy
      # providers would triple CI time for no extra coverage.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy faiss-cpu rank-bm25 pydantic pydantic-settings \
                      fastapi "uvicorn[standard]" httpx pytest ruff

      - name: Lint
        run: ruff check src eval scripts tests

      - name: Test
        run: python -m pytest -q

  evaluate:
    # Reruns the retrieval evaluation on the committed corpus so a change that
    # quietly degrades recall shows up in the PR instead of in production.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build index
        run: python scripts/ingest.py --embedding-backend local

      - name: Evaluate both query sets
        run: |
          python eval/run_eval.py --ablate --k-sweep 1,3,5,10 --generate \
            --llm-backend mock
          python eval/run_eval.py --ablate -k 3 \
            --golden eval/golden_keyword.jsonl \
            --out eval/results_keyword.md --json-out eval/results_keyword.json

      - name: Check retrieval has not regressed
        run: |
          python - <<'PY'
          import json, sys

          THRESHOLDS = {
              "eval/results.json": 0.90,          # natural-language questions
              "eval/results_keyword.json": 0.80,  # keyword / exact-token queries
          }
          failed = False
          for path, floor in THRESHOLDS.items():
              report = json.load(open(path))
              k = report["k"]
              best = max(
                  r["aggregate"][f"recall@{k}"] for r in report["retrieval"].values()
              )
              status = "ok" if best >= floor else "REGRESSED"
              print(f"{status}: {path} best recall@{k}={best:.3f} (floor {floor})")
              failed |= best < floor
          sys.exit(1 if failed else 0)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: |
            eval/results.md
            eval/results.json
            eval/results_keyword.md
            eval/results_keyword.json
